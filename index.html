<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secretaria Online — Universidade Rovuma</title>
    <meta
      name="description"
      content="Protótipo de tramitação digital da Universidade Rovuma"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" />
        <path d="M9 21v-7h6v7" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path
          d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
        />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20h-3v-.1a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.12 15a1.7 1.7 0 0 0-1.55-1H5v-3h.1a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.55V4h3v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.55 1h.1v3h-.1a1.7 1.7 0 0 0-1.55 1Z"
        />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v6h6M8 13h8M8 17h6" />
      </symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">UR</div>
          <div>
            <strong>Universidade Rovuma</strong><span>Secretaria Online</span>
          </div>
        </div>
        <nav class="nav-section" id="mainNav"></nav>
        <div class="nav-section account-nav">
          <p>CONTA</p>
          <button class="nav-item">
            <svg><use href="#i-user" /></svg>Meu perfil</button
          ><button class="nav-item">
            <svg><use href="#i-settings" /></svg>Configuração
          </button>
        </div>
        <div class="sidebar-footer">
          <div class="mini-user">
            <div class="avatar" id="sideAvatar"></div>
            <div>
              <strong id="sideName"></strong><small id="sideRole"></small
              ><small id="sideUnit"></small>
            </div>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="menuBtn" aria-label="Abrir menu">
            <svg><use href="#i-menu" /></svg>
          </button>
          <div class="breadcrumb">
            <span>Secretaria Online</span><i>/</i
            ><strong id="pageCrumb">Início</strong>
          </div>
          <div class="top-actions">
            <button
              class="notification-btn"
              title="Notificações"
              aria-label="Notificações"
            >
              <svg><use href="#i-bell" /></svg><em>2</em>
            </button>
            <div class="demo-profile">
              <label for="profileSelect">SIMULAR UTILIZADOR</label
              ><select
                id="profileSelect"
                aria-label="Simular utilizador"
              ></select>
            </div>
            <div class="top-user">
              <div class="avatar small" id="topAvatar"></div>
              <span id="topName"></span>
            </div>
          </div>
        </header>
        <section class="content" id="app"></section>
      </main>
    </div>
    <div class="modal" id="modal">
      <div class="modal-backdrop"></div>
      <div class="modal-card" id="modalContent"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="assets/app.js"></script>
  </body>
</html>
